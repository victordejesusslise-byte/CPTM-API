<p class="sobre">Pátio · 02</p>
<h1>Placa do feixe</h1>

<section class="cartao pilha">
  <header><h2>Ler a placa</h2><span class="nota">o servidor lê a foto; você confere</span></header>
  <mat-form-field appearance="outline">
    <mat-label>Pedido (para conferir a placa)</mat-label>
    <mat-select [value]="idPedido()" (selectionChange)="idPedido.set($event.value)">
      <mat-option [value]="null">Sem pedido</mat-option>
      @for (p of abertos(); track p.id) { <mat-option [value]="p.id">{{ p.codigo }} · {{ p.empresa }}</mat-option> }
    </mat-select>
  </mat-form-field>
  <app-ler-placa [idPedido]="idPedido()" />
</section>
